AutoName: SubScript

Summary: Privacy-first local subscription and recurring expense tracker

Description: |-
  SubScript is a privacy-first, local-only Android application designed
  to track subscriptions, recurring memberships, and upcoming bills without
  relying on cloud servers, accounts, or proprietary SDKs.

  Features:
  * Zero Internet Permission: Operates entirely offline
  * Local Storage: Uses Android Jetpack Room on-device SQLite database
  * Local Native Alerts: Schedules reminders 24h prior via native AlarmManager
  * Monthly Cost Projection: Normalizes weekly, monthly, and yearly cycles
  * Material 3 UI: Dynamic colors, light & dark themes

